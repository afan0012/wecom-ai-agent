[project]
name = "wecom-ai-agent"
version = "0.2.0"
description = "Self-hosted WeCom customer-service AI agent with an auditable Markdown knowledge base"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0",
  "defusedxml>=0.7",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = false
